<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="A Forge session: the agent edits a file, a watcher flags a problem, checks and an independent review pass, and a summary card closes the request">
  <style>
    text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; }
    .dim { fill: #8b8378; }
    .fg { fill: #ece5dc; }
    .or { fill: #ff8a2a; }
    .ye { fill: #ffd166; }
    .gr { fill: #5fd38d; }
    .re { fill: #f0705f; }
    .l { opacity: 0; animation: in 0.35s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
  </style>

  <rect width="1000" height="600" rx="14" fill="#0e0f13"/>
  <rect x="0.75" y="0.75" width="998.5" height="598.5" rx="13.25" fill="none" stroke="#2a2622" stroke-width="1.5"/>
  <path d="M0 14a14 14 0 0 1 14-14h972a14 14 0 0 1 14 14v28H0z" fill="#17161a"/>
  <circle cx="24" cy="21" r="6" fill="#f0705f"/>
  <circle cx="46" cy="21" r="6" fill="#ffd166"/>
  <circle cx="68" cy="21" r="6" fill="#5fd38d"/>
  <text x="500" y="26" text-anchor="middle" class="dim" style="font-size:13px">forge — ~/projects/my-app</text>

  <g class="l" style="animation-delay:0.2s">
    <rect x="24" y="60" width="952" height="34" rx="6" fill="#1a1917"/>
    <text x="38" y="82"><tspan class="or">❯</tspan><tspan class="fg" dx="10">add rate limiting to the upload route</tspan></text>
  </g>

  <text x="38" y="126" class="l" style="animation-delay:1.0s"><tspan class="or">◆</tspan><tspan class="fg" dx="10">I'll add a limiter to the route and cover it with tests.</tspan></text>

  <g class="l" style="animation-delay:1.8s">
    <text x="38" y="160"><tspan class="gr">●</tspan><tspan class="fg" dx="10" font-weight="700">Edit</tspan><tspan class="fg" dx="9">src/routes/upload.ts</tspan></text>
    <text x="62" y="182"><tspan class="dim">└  41</tspan><tspan class="gr" dx="9">+ const limiter = rateLimit({ windowMs: 60_000, max: 20 });</tspan></text>
  </g>

  <g class="l" style="animation-delay:2.6s">
    <text x="38" y="212"><tspan class="gr">●</tspan><tspan class="fg" dx="10" font-weight="700">Write</tspan><tspan class="fg" dx="9">test/upload.test.ts</tspan></text>
    <text x="62" y="234" class="dim">└ created, 31 lines</text>
  </g>

  <text x="38" y="266" class="l ye" style="animation-delay:3.5s">· The watcher flagged something in the recent edits; passing it to the model.</text>

  <g class="l" style="animation-delay:4.3s">
    <text x="38" y="298"><tspan class="gr">●</tspan><tspan class="fg" dx="10" font-weight="700">Edit</tspan><tspan class="fg" dx="9">src/routes/upload.ts</tspan></text>
    <text x="62" y="320"><tspan class="dim">└  58</tspan><tspan class="re" dx="9">- } catch {}</tspan></text>
    <text x="89" y="342"><tspan class="dim">58</tspan><tspan class="gr" dx="9">+ } catch (err) { next(err); }</tspan></text>
  </g>

  <g class="l" style="animation-delay:5.2s">
    <text x="38" y="374"><tspan class="gr">●</tspan><tspan class="fg" dx="10" font-weight="700">Check</tspan><tspan class="fg" dx="9">npm test</tspan></text>
    <text x="62" y="396" class="dim">└ 48 passed</text>
  </g>

  <g class="l" style="animation-delay:6.1s">
    <text x="38" y="426"><tspan class="gr">●</tspan><tspan class="fg" dx="10" font-weight="700">Review</tspan><tspan class="fg" dx="9">independent reviewer, fresh context</tspan></text>
    <text x="62" y="448" class="dim">└ no findings</text>
  </g>

  <g class="l" style="animation-delay:7.0s">
    <rect x="24" y="470" width="952" height="108" rx="8" fill="none" stroke="#5a5148" stroke-width="1.2"/>
    <rect x="42" y="461" width="60" height="18" fill="#0e0f13"/>
    <text x="50" y="475" class="dim">Done</text>
    <text x="44" y="502"><tspan class="dim">Changed</tspan><tspan class="fg" dx="19">src/routes/upload.ts</tspan><tspan class="gr" dx="9">+14</tspan><tspan class="re" dx="9">−2</tspan><tspan class="dim" dx="18">·</tspan><tspan class="fg" dx="18">test/upload.test.ts</tspan><tspan class="gr" dx="9">+31</tspan><tspan class="dim" dx="9">new</tspan></text>
    <text x="44" y="528"><tspan class="dim">Verified</tspan><tspan class="gr" dx="10">✓ checks passed</tspan><tspan class="dim" dx="9">·</tspan><tspan class="gr" dx="9">✓ review: no findings</tspan></text>
    <text x="44" y="554"><tspan class="dim">Took</tspan><tspan class="fg" dx="46">1m 12s</tspan><tspan class="dim" dx="9">·</tspan><tspan class="fg" dx="9">9 model requests</tspan><tspan class="dim" dx="9">·</tspan><tspan class="fg" dx="9">$0.0412</tspan><tspan class="dim" dx="24">/undo takes these changes back</tspan></text>
  </g>
</svg>
