<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Pair mode, animated: two different models each propose an approach on their own, swap and critique each other's proposal, agree on a plan that splits the work, code their parts at the same time while messaging each other, then cross-check each other's work until both parts fit.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8378"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .h { fill: #f3ece4; font-size: 21px; font-weight: 700; }
    .sub { fill: #a39a90; font-size: 13px; }
    .pill { fill: #17161a; stroke: #3a332c; stroke-width: 1; }
    .pt { fill: #d8cfc4; font-size: 12.5px; font-weight: 700; }
    .lane { fill: #17161a; stroke-width: 1.4; }
    .lead { stroke: #ff8a2a; }
    .part { stroke: #b48cff; }
    .ln { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .lnm { fill: #f3ece4; font-size: 15px; font-weight: 700; }
    .card { fill: #1b191e; stroke-width: 1.1; stroke-opacity: 0.7; }
    .ct { font-size: 11.5px; font-weight: 700; }
    .cx { fill: #ece5dc; font-size: 12.5px; }
    .or { fill: #ff8a2a; }
    .vi { fill: #b48cff; }
    .dim { fill: #8b8378; font-size: 12px; }
    .gr { fill: #5fd38d; }
    .chip { fill: #221c17; stroke: #ffd166; stroke-opacity: 0.5; stroke-width: 1; }
    .chipt { fill: #ffd166; font-size: 11.5px; font-weight: 700; }
    .x { stroke: #8b8378; stroke-width: 1.4; fill: none; }
    .foot { fill: #a39a90; font-size: 12.5px; }
    .k { fill: #f3ece4; font-weight: 700; }

    .p1, .p2, .p3, .p4, .p5, .hl { animation-duration: 22s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .p1 { animation-name: k1; } .p2 { animation-name: k2; } .p3 { animation-name: k3; } .p4 { animation-name: k4; } .p5 { animation-name: k5; }
    @keyframes k1 { 0%, 2% { opacity: 0; } 5%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes k2 { 0%, 19% { opacity: 0; } 22%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes k3 { 0%, 36% { opacity: 0; } 39%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes k4 { 0%, 53% { opacity: 0; } 56%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes k5 { 0%, 72% { opacity: 0; } 75%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .hl { animation-name: move; animation-timing-function: ease-in-out; }
    @keyframes move {
      0% { transform: translateX(0); opacity: 0; }
      2%, 17% { transform: translateX(0); opacity: 1; }
      20%, 34% { transform: translateX(152px); opacity: 1; }
      37%, 51% { transform: translateX(304px); opacity: 1; }
      54%, 70% { transform: translateX(456px); opacity: 1; }
      73%, 94% { transform: translateX(608px); opacity: 1; }
      98%, 100% { transform: translateX(608px); opacity: 0; }
    }
    .down { animation: down 1.6s ease-in-out infinite; }
    .up { animation: up 1.6s ease-in-out infinite 0.8s; }
    @keyframes down { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(104px); opacity: 0; } }
    @keyframes up { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-104px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .p5, .down, .up { animation: none; opacity: 1; }
      .hl { animation: none; opacity: 0; }
    }
  </style>

  <rect width="1000" height="450" rx="16" fill="#0e0f13"/>
  <rect x="0.75" y="0.75" width="998.5" height="448.5" rx="15.25" fill="none" stroke="#2a2622" stroke-width="1.5"/>

  <text class="h" x="24" y="40">Pair mode</text>
  <text class="sub" x="134" y="40">two different models · one request · from the first idea to the final check</text>

  <!-- the active phase -->
  <rect class="hl" x="216" y="56" width="150" height="330" rx="12" fill="#b48cff" fill-opacity="0.06" stroke="#b48cff" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- phase headers -->
  <g>
    <rect class="pill" x="222" y="64" width="138" height="24" rx="12"/><text class="pt" x="291" y="80" text-anchor="middle">1 · Propose</text>
    <rect class="pill" x="374" y="64" width="138" height="24" rx="12"/><text class="pt" x="443" y="80" text-anchor="middle">2 · Argue</text>
    <rect class="pill" x="526" y="64" width="138" height="24" rx="12"/><text class="pt" x="595" y="80" text-anchor="middle">3 · Plan &amp; split</text>
    <rect class="pill" x="678" y="64" width="138" height="24" rx="12"/><text class="pt" x="747" y="80" text-anchor="middle">4 · Code together</text>
    <rect class="pill" x="830" y="64" width="138" height="24" rx="12"/><text class="pt" x="899" y="80" text-anchor="middle">5 · Cross-check</text>
  </g>

  <!-- the two models -->
  <rect class="lane lead" x="24" y="100" width="178" height="76" rx="10"/>
  <text class="ln or" x="40" y="124">LEAD · YOUR MODEL</text>
  <text class="lnm" x="40" y="146">Claude Haiku 5.5</text>
  <text class="dim" x="40" y="164">any provider</text>

  <rect class="lane part" x="24" y="296" width="178" height="76" rx="10"/>
  <text class="ln vi" x="40" y="320">PARTNER · /pair</text>
  <text class="lnm" x="40" y="342">Claude Opus 5.5</text>
  <text class="dim" x="40" y="360">must be a different model</text>

  <!-- 1 propose -->
  <g class="p1">
    <rect class="card lead" x="222" y="100" width="138" height="76" rx="9"/>
    <text class="ct or" x="234" y="121">PROPOSES</text>
    <text class="cx" x="234" y="141">a plain Map</text>
    <text class="cx" x="234" y="159">as the cache</text>
    <text class="dim" x="291" y="226" text-anchor="middle">each on its own,</text>
    <text class="dim" x="291" y="244" text-anchor="middle">without seeing</text>
    <text class="dim" x="291" y="262" text-anchor="middle">the other's idea</text>
    <rect class="card part" x="222" y="296" width="138" height="76" rx="9"/>
    <text class="ct vi" x="234" y="317">PROPOSES</text>
    <text class="cx" x="234" y="337">an LRU cache</text>
    <text class="cx" x="234" y="355">with a size limit</text>
  </g>

  <!-- 2 argue -->
  <g class="p2">
    <rect class="card lead" x="374" y="100" width="138" height="76" rx="9"/>
    <text class="ct or" x="386" y="121">CRITIQUES</text>
    <text class="cx" x="386" y="141">DIFFER: LRU wins,</text>
    <text class="cx" x="386" y="159">I'll take it</text>
    <path class="x" d="M400 186 L486 286" marker-end="url(#ar)"/>
    <path class="x" d="M486 186 L400 286" marker-start="url(#ar)"/>
    <text class="dim" x="443" y="240" text-anchor="middle" style="paint-order:stroke;stroke:#0e0f13;stroke-width:6px">swap</text>
    <rect class="card part" x="374" y="296" width="138" height="76" rx="9"/>
    <text class="ct vi" x="386" y="317">CRITIQUES</text>
    <text class="cx" x="386" y="337">AGREE: LRU</text>
    <text class="cx" x="386" y="355">with a limit</text>
  </g>

  <!-- 3 plan -->
  <g class="p3">
    <rect class="card lead" x="526" y="100" width="138" height="76" rx="9"/>
    <text class="ct or" x="538" y="121">WRITES THE PLAN</text>
    <text class="cx" x="538" y="141">approach + split</text>
    <text class="cx" x="538" y="159">into two parts</text>
    <rect x="538" y="190" width="114" height="94" rx="7" fill="#f3ece4" fill-opacity="0.06" stroke="#ffd166" stroke-opacity="0.55"/>
    <text class="chipt" x="550" y="209">PLAN</text>
    <text class="cx" x="550" y="228" style="font-size:11.5px"><tspan class="or">lead</tspan> cache.js</text>
    <text class="cx" x="550" y="246" style="font-size:11.5px"><tspan class="vi">partner</tspan> tests</text>
    <text class="cx" x="550" y="264" style="font-size:11.5px">shared get/set</text>
    <rect class="card part" x="526" y="296" width="138" height="76" rx="9"/>
    <text class="ct vi" x="538" y="317">TAKES ITS PART</text>
    <text class="cx" x="538" y="337">no file belongs</text>
    <text class="cx" x="538" y="355">to both of them</text>
  </g>

  <!-- 4 code together -->
  <g class="p4">
    <rect class="card lead" x="678" y="100" width="138" height="76" rx="9"/>
    <text class="ct or" x="690" y="121">CODES</text>
    <text class="cx" x="690" y="141"><tspan class="gr">●</tspan> Write cache.js</text>
    <text class="cx" x="690" y="159">at the same time</text>
    <rect class="chip" x="696" y="196" width="102" height="22" rx="11"/>
    <text class="chipt" x="747" y="211" text-anchor="middle">✉ get/set ready</text>
    <rect class="chip" x="696" y="256" width="102" height="22" rx="11" style="stroke:#b48cff"/>
    <text class="chipt" x="747" y="271" text-anchor="middle" style="fill:#b48cff">✉ tests written</text>
    <circle class="down" cx="686" cy="182" r="3.5" fill="#ffd166"/>
    <circle class="up" cx="808" cy="290" r="3.5" fill="#b48cff"/>
    <rect class="card part" x="678" y="296" width="138" height="76" rx="9"/>
    <text class="ct vi" x="690" y="317">CODES</text>
    <text class="cx" x="690" y="337"><tspan class="gr">●</tspan> Write tests</text>
    <text class="cx" x="690" y="355">and keeps talking</text>
  </g>

  <!-- 5 cross-check -->
  <g class="p5">
    <rect class="card lead" x="830" y="100" width="138" height="76" rx="9"/>
    <text class="ct or" x="842" y="121">CHECKS PARTNER</text>
    <text class="cx" x="842" y="141">reads the tests</text>
    <text class="cx" x="842" y="159"><tspan class="gr">✔</tspan> they pass</text>
    <rect x="846" y="210" width="106" height="52" rx="9" fill="#5fd38d" fill-opacity="0.1" stroke="#5fd38d" stroke-opacity="0.7"/>
    <text class="gr" x="899" y="233" text-anchor="middle" style="font-size:15px;font-weight:700">✔ done</text>
    <text class="dim" x="899" y="251" text-anchor="middle" style="font-size:11px">both parts fit</text>
    <rect class="card part" x="830" y="296" width="138" height="76" rx="9"/>
    <text class="ct vi" x="842" y="317">CHECKS LEAD</text>
    <text class="cx" x="842" y="337">reads cache.js</text>
    <text class="cx" x="842" y="355"><tspan class="gr">✔</tspan> fits the plan</text>
  </g>

  <line x1="24" y1="398" x2="976" y2="398" stroke="#2a2622"/>
  <text class="foot" x="24" y="422"><tspan class="k">Pair</tspan>: a second engineer at the desk — both plan, code and review, on every request.</text>
  <text class="foot" x="24" y="440"><tspan class="k">Advisor</tspan>: a phone call to an expert — one answer when the working model asks, no tools.</text>
</svg>
